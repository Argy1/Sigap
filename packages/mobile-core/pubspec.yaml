name: mobile_core
description: >-
  Package bersama untuk App Pasien & App Sopir — sistem desain "Dispatch
  Console", model data, API client, dan layanan realtime.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: '>=3.41.0'

# Bagian dari pub workspace di root repo — lihat /pubspec.yaml.
resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  # State management (ditetapkan di CLAUDE.md)
  flutter_riverpod: ^3.0.3

  # HTTP + realtime
  dio: ^5.9.0
  socket_io_client: ^3.1.2

  # Penyimpanan token yang aman
  flutter_secure_storage: ^9.2.4

  # Lokasi GPS
  geolocator: ^14.0.2

  # Peta. Hanya di-instansiasi kalau GOOGLE_MAPS_API_KEY diisi saat build —
  # lihat DispatchMap. Tanpa key, ConsoleMap (CustomPaint bergaya mockup)
  # yang dipakai, dan aplikasi tetap berjalan penuh.
  google_maps_flutter: ^2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Font di-bundel di package ini, bukan di tiap app, supaya App Pasien dan
  # App Sopir dijamin memakai tipografi yang sama persis.
  #
  # Ketiganya font VARIABLE (satu berkas, sumbu wght kontinu). Karena itu
  # dideklarasikan tanpa kunci `weight`, dan ketebalannya diatur lewat
  # FontVariation di DispatchTypography — bukan lewat penebalan sintetis.
  fonts:
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
